# BolDeSangManager — Docker Compose NAS (QNAP / Synology / x86 ou arm64)
# Inclut nginx-proxy + Let's Encrypt automatique (acme-companion)
#
# Usage :
#   1. Copier ce fichier et un .env (gitignored) dans le meme dossier sur le NAS
#   2. Definir dans .env : LETSENCRYPT_EMAIL, PUBLIC_HOSTNAME
#   3. Ouvrir les ports 80 et 443 sur la box vers le NAS
#   4. docker compose -f docker-compose.nas.yml up -d

services:

  # ── Reverse proxy HTTPS ──────────────────────────────────────────────────────
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
    restart: unless-stopped

  # ── Renouvellement automatique des certificats Let's Encrypt ─────────────────
  acme-companion:
    image: nginxproxy/acme-companion
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme-state:/etc/acme.sh
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
    restart: unless-stopped
    depends_on:
      - nginx-proxy

  # ── Application ──────────────────────────────────────────────────────────────
  app:
    image: cwarp/boldesangmanager:latest
    expose:
      - "8080"
    volumes:
      - boldesang-data:/data
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: ${PUBLIC_HOSTNAME}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${PUBLIC_HOSTNAME}
    restart: unless-stopped
    depends_on:
      - nginx-proxy

volumes:
  boldesang-data:
  nginx-certs:
  nginx-vhost:
  nginx-html:
  acme-state:
